[workspace]
members = ["obj", "rl_input", "rl_term"]

[package]
name = "ea-rs-3"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
anyhow = "1.0.100"
arrayvec = "0.7.6"
ext-trait = "2.0.1"
miette = "7.6.0"
nom = "8.0.0"
raylib = "5.5.1"
rl_input = { path = "rl_input" }
# obj = { path = "obj" }
rustc-hash = "2.1.1"
serde = "1.0.228"
serde_derive = "1.0.228"
thiserror = "2.0.17"
toml = { version = "0.9.7", features = ["fast_hash"] }

[features]
dbg_order_algorithm = []
